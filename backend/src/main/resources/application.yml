spring:
  application:
    name: hellocr
  datasource:
    url: jdbc:postgresql://localhost:5432/hellocr
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  zona-horaria: America/Costa_Rica
  url-publica: http://localhost:5173
  jwt:
    duracion-access: 15m
    duracion-refresh: 30d
    cookie-segura: true
  correo:
    modo: consola
    asincrono: true
    remitente: "HelloCR <no-responder@hellocr.local>"
    duracion-verificacion: 24h
    duracion-recuperacion: 1h
    espera-reenvio: 1m
  cuentas:
    dias-sin-verificar: 7
  login:
    max-intentos: 5
    bloqueo: 15m
  mensajes:
    limite-cantidad: 30
    limite-ventana: 10s
  grupos:
    max-miembros: 50
  tiempo-real:
    latido: 10s
# Credenciales de la base y app.jwt.secreto van en application-local.yml (ignorado por git).
